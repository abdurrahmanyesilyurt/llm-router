global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: llm-router
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]  # `docker compose --profile api up`
        labels:
          source: compose
      - targets: ["host.docker.internal:8000"]  # `llm-router serve --host 0.0.0.0` on the host
        labels:
          source: host
